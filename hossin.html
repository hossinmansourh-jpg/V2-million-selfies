<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - جدارية المليون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* ===== المتغيرات ===== */
    :root {
      --bg-dark: #0a0a0f;
      --bg-gray: #14141c;
      --bg-light: #2a2a35;
      --gold: #d4a017;
      --gold-light: #f5b301;
      --blue: #4a9eff;
      --green: #3a9a3a;
      --red: #9a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0b0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 60px;
    }

    /* ===== شاشة تسجيل الدخول ===== */
    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: var(--bg-gray);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
    }

    .login-box h1 {
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-family: 'Cairo', sans-serif;
      margin-bottom: 15px;
      text-align: center;
    }

    .login-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--bg-dark);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: var(--gold-light);
    }

    .login-btn:disabled {
      background: var(--bg-light);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--red);
      font-size: 14px;
      margin-top: 10px;
      font-weight: 700;
      min-height: 20px;
    }

    /* ===== لوحة التحكم ===== */
    .admin-panel {
      max-width: 900px;
      margin: 0 auto;
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    /* ===== رأس اللوحة ===== */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-header h1 {
      color: var(--gold);
      font-weight: 900;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-btn {
      background: var(--bg-gray);
      color: var(--gold);
      border: 1.5px solid var(--gold);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
    }

    .header-btn.danger {
      border-color: var(--red);
      color: var(--red);
    }

    .header-btn.danger:hover {
      background: var(--red);
      color: #fff;
    }

    /* ===== عناوين الأقسام ===== */
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin: 30px 0 15px;
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      border-right: 4px solid var(--gold);
      padding-right: 12px;
    }

    /* ===== شبكة الإحصائيات ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: var(--bg-gray);
      border: 1px solid var(--bg-light);
      border-radius: 12px;
      padding: 25px 15px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-box.blue-top::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--blue);
      box-shadow: 0 0 12px var(--blue);
    }

    .stat-box.gold-top::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }

    .stat-box .num {
      display: block;
      font-size: 32px;
      font-weight: 900;
      font-family: 'Cairo', sans-serif;
      margin-bottom: 8px;
      direction: ltr;
    }

    .stat-box .num.blue {
      color: var(--blue);
    }

    .stat-box .num.gold {
      color: var(--gold-light);
    }

    .stat-box .num.green {
      color: #4ade80;
    }

    .stat-box .num.red {
      color: #ff5555;
    }

    .stat-box .lbl {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* ===== التبويبات ===== */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-gray);
      color: var(--text-muted);
      border: 1.5px solid var(--bg-light);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
    }

    .tab-btn:hover:not(.active) {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ===== البحث ===== */
    .search-box {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-gray);
      border: 1.5px solid var(--bg-light);
      border-radius: 10px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--gold);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    /* ===== بطاقات الطلبات ===== */
    .booking-card {
      background: var(--bg-gray);
      border: 1px solid var(--bg-light);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .booking-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid var(--bg-light);
      flex-shrink: 0;
    }

    .booking-info {
      flex: 1;
      min-width: 200px;
    }

    .booking-info p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 5px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
    }

    .booking-info p strong {
      color: #fff;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
    }

    .status-pending { background: #8a6a1a; color: #fff; }
    .status-approved { background: #3a9a3a; color: #fff; }
    .status-rejected { background: #9a3a3a; color: #fff; }

    .booking-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 100px;
    }

    .action-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      color: white;
      transition: 0.3s;
    }

    .action-btn:hover {
      opacity: 0.85;
    }

    .approve-btn { background: #3a9a3a; }
    .reject-btn { background: #9a3a3a; }
    .delete-btn { background: #555; }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      background: var(--bg-gray);
      border-radius: 12px;
      border: 1px dashed var(--bg-light);
    }

    /* ===== الهاتف ===== */
    @media (max-width: 600px) {
      .admin-header h1 { font-size: 22px; }
      .stat-box .num { font-size: 26px; }
      .stat-box { padding: 20px 10px; }
      .booking-card { padding: 14px; }
      .booking-card img { width: 80px; height: 80px; }
      .header-btn { padding: 8px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="login-box" id="loginBox">
    <h1>🔒 لوحة التحكم</h1>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" />
    <button class="login-btn" id="loginBtn">دخول</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <!-- لوحة التحكم -->
  <div class="admin-panel" id="adminPanel">
    
    <!-- الرأس -->
    <div class="admin-header">
      <h1>🎛️ لوحة التحكم</h1>
      <div class="header-buttons">
        <button class="header-btn" id="refreshBtn">🔄 تحديث</button>
        <button class="header-btn danger" id="logoutBtn">🚪 خروج</button>
      </div>
    </div>

    <!-- إحصائيات الزوار -->
    <div class="section-heading">
      👥 إحصائيات الزوار
    </div>
    <div class="stats-grid">
      <div class="stat-box blue-top">
        <span class="num blue" id="totalVisits">0</span>
        <span class="lbl">إجمالي الزيارات</span>
      </div>
      <div class="stat-box blue-top">
        <span class="num blue" id="todayVisits">0</span>
        <span class="lbl">زيارات اليوم</span>
      </div>
      <div class="stat-box blue-top">
        <span class="num blue" id="weekVisits">0</span>
        <span class="lbl">آخر 7 أيام</span>
      </div>
      <div class="stat-box blue-top">
        <span class="num blue" id="monthVisits">0</span>
        <span class="lbl">آخر 30 يوماً</span>
      </div>
    </div>

    <!-- إحصائيات الطلبات -->
    <div class="section-heading">
      📋 إحصائيات الطلبات
    </div>
    <div class="stats-grid">
      <div class="stat-box gold-top">
        <span class="num gold" id="totalBookings">0</span>
        <span class="lbl">إجمالي الطلبات</span>
      </div>
      <div class="stat-box gold-top">
        <span class="num gold" id="pendingCount">0</span>
        <span class="lbl">قيد الانتظار</span>
      </div>
      <div class="stat-box gold-top">
        <span class="num green" id="approvedCount">0</span>
        <span class="lbl">مقبولة</span>
      </div>
      <div class="stat-box gold-top">
        <span class="num red" id="rejectedCount">0</span>
        <span class="lbl">مرفوضة</span>
      </div>
      <div class="stat-box gold-top" style="grid-column: span 2;">
        <span class="num gold" id="totalRevenue">$0</span>
        <span class="lbl">إجمالي المبالغ</span>
      </div>
    </div>

    <!-- إدارة الطلبات -->
    <div class="section-heading">
      🗂️ إدارة الطلبات
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pending">قيد الانتظار</button>
      <button class="tab-btn" data-tab="approved">مقبولة</button>
      <button class="tab-btn" data-tab="rejected">مرفوضة</button>
      <button class="tab-btn" data-tab="all">الكل</button>
    </div>

    <input type="text" class="search-box" id="searchBox" placeholder="🔍 ابحث بالاسم أو الهاتف أو رقم المربع..." />

    <div id="bookingsList"></div>

  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeNKi4mjxT8ADaDRSwa8Hriyl_ocC315A",
      authDomain: "v2-million-selfies.firebaseapp.com",
      projectId: "v2-million-selfies",
      storageBucket: "v2-million-selfies.firebasestorage.app",
      messagingSenderId: "853762238562",
      appId: "1:853762238562:web:b613fe254d79b4afb6c93b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const ADMIN_EMAIL = "hossinmansourh@gmail.com";

    let allBookings = [];
    let currentTab = 'pending';
    let searchQuery = '';

    // ===== تسجيل الدخول =====
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const password = document.getElementById('passwordInput').value;
      const errMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      if (!password) {
        errMsg.textContent = 'أدخل كلمة المرور';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, password);
        errMsg.textContent = '';
      } catch (error) {
        console.error(error);
        errMsg.textContent = '❌ كلمة المرور غير صحيحة';
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    });

    // ===== Enter للدخول =====
    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // ===== مراقبة حالة الدخول =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').classList.add('active');
        loadAllData();
        setInterval(loadAllData, 30000);
      } else {
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').textContent = 'دخول';
      }
    });

    // ===== الخروج =====
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('هل تريد الخروج؟')) {
        await signOut(auth);
      }
    });

    // ===== زر التحديث =====
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadAllData();
    });

    // ===== تحميل كل البيانات =====
    async function loadAllData() {
      await loadBookings();
      await loadVisits();
    }

    // ===== تحميل الحجوزات =====
    async function loadBookings() {
      try {
        const q = query(collection(db, "bookings"), orderBy("timestamp", "desc"));
        const snapshot = await getDocs(q);
        allBookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        updateBookingStats();
        renderBookings();
      } catch (error) {
        console.error("خطأ في تحميل الحجوزات:", error);
      }
    }

    // ===== تحميل الزيارات =====
    async function loadVisits() {
      try {
        const snapshot = await getDocs(collection(db, "visits"));
        const visits = snapshot.docs.map(d => d.data());
        const today = new Date().toISOString().split('T')[0];
        const now = Date.now();
        const sevenDaysAgo = now - (7 * 24 * 60 * 60 * 1000);
        const thirtyDaysAgo = now - (30 * 24 * 60 * 60 * 1000);

        const todayCount = visits.filter(v => v.date === today).length;
        const weekCount = visits.filter(v => v.timestamp >= sevenDaysAgo).length;
        const monthCount = visits.filter(v => v.timestamp >= thirtyDaysAgo).length;

        document.getElementById('totalVisits').textContent = visits.length.toLocaleString('en-US');
        document.getElementById('todayVisits').textContent = todayCount.toLocaleString('en-US');
        document.getElementById('weekVisits').textContent = weekCount.toLocaleString('en-US');
        document.getElementById('monthVisits').textContent = monthCount.toLocaleString('en-US');
      } catch (error) {
        console.error("خطأ في تحميل الزيارات:", error);
      }
    }

    // ===== إحصائيات الحجوزات =====
    function updateBookingStats() {
      const pending = allBookings.filter(b => b.status === 'pending').length;
      const approved = allBookings.filter(b => b.status === 'approved').length;
      const rejected = allBookings.filter(b => b.status === 'rejected').length;
      const totalRevenue = allBookings
        .filter(b => b.status === 'approved')
        .reduce((sum, b) => sum + (b.totalPrice || 0), 0);

      document.getElementById('totalBookings').textContent = allBookings.length.toLocaleString('en-US');
      document.getElementById('pendingCount').textContent = pending.toLocaleString('en-US');
      document.getElementById('approvedCount').textContent = approved.toLocaleString('en-US');
      document.getElementById('rejectedCount').textContent = rejected.toLocaleString('en-US');
      document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toLocaleString('en-US');
    }

    // ===== عرض الحجوزات =====
    function renderBookings() {
      const list = document.getElementById('bookingsList');
      let filtered = allBookings;

      if (currentTab !== 'all') {
        filtered = filtered.filter(b => b.status === currentTab);
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(b =>
          (b.userName || '').toLowerCase().includes(q) ||
          (b.userPhone || '').includes(q) ||
          (b.startCell || '').toString().includes(q)
        );
      }

      if (filtered.length === 0) {
        list.innerHTML = '<p class="empty-msg">لا توجد طلبات في هذه الفئة</p>';
        return;
      }

      list.innerHTML = filtered.map(b => {
        const statusClass = b.status === 'pending' ? 'status-pending' :
                           b.status === 'approved' ? 'status-approved' : 'status-rejected';
        const statusText = b.status === 'pending' ? 'قيد الانتظار' :
                          b.status === 'approved' ? 'مقبولة' : 'مرفوضة';

        return `
          <div class="booking-card" data-id="${b.id}">
            <img src="${b.selfieUrl || ''}" alt="سيلفي" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%232a2a35%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 fill=%22%23a0a0b0%22 text-anchor=%22middle%22 font-size=%2212%22>لا صورة</text></svg>'">
            <div class="booking-info">
              <p><strong>الاسم:</strong> ${b.userName || 'زائر'}</p>
              <p><strong>الهاتف:</strong> ${b.userPhone || '-'}</p>
              <p><strong>المربعات:</strong> ${b.quantity || 0} (يبدأ من ${b.startCell || 0})</p>
              <p><strong>السعر:</strong> $${b.totalPrice || 0}</p>
              <p><strong>الدفع:</strong> ${b.paymentMethod || '-'}</p>
              <p><strong>الحالة:</strong> <span class="status-badge ${statusClass}">${statusText}</span></p>
            </div>
            <div class="booking-actions">
              ${b.status !== 'approved' ? `<button class="action-btn approve-btn" onclick="approveBooking('${b.id}')">✅ قبول</button>` : ''}
              ${b.status !== 'rejected' ? `<button class="action-btn reject-btn" onclick="rejectBooking('${b.id}')">❌ رفض</button>` : ''}
              <button class="action-btn delete-btn" onclick="deleteBooking('${b.id}')">🗑️ حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== قبول الطلب =====
    window.approveBooking = async (id) => {
      if (!confirm('هل تريد قبول هذا الطلب؟')) return;
      try {
        await updateDoc(doc(db, "bookings", id), {
          status: 'approved',
          approvedAt: Date.now()
        });
        await loadBookings();
      } catch (error) {
        console.error(error);
        alert('حدث خطأ');
      }
    };

    // ===== رفض الطلب =====
    window.rejectBooking = async (id) => {
      if (!confirm('هل تريد رفض هذا الطلب؟')) return;
      try {
        await updateDoc(doc(db, "bookings", id), {
          status: 'rejected',
          rejectedAt: Date.now()
        });
        await loadBookings();
      } catch (error) {
        console.error(error);
        alert('حدث خطأ');
      }
    };

    // ===== حذف الطلب =====
    window.deleteBooking = async (id) => {
      if (!confirm('هل تريد حذف هذا الطلب نهائياً؟')) return;
      try {
        await deleteDoc(doc(db, "bookings", id));
        await loadBookings();
      } catch (error) {
        console.error(error);
        alert('حدث خطأ');
      }
    };

    // ===== التبويبات =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderBookings();
      });
    });

    // ===== البحث =====
    document.getElementById('searchBox').addEventListener('input', (e) => {
      searchQuery = e.target.value;
