<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكافأتي - مليون بصمة رقمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-gray: #14141c;
      --bg-light: #2a2a35;
      --gold: #d4a017;
      --gold-light: #f5b301;
      --blue: #4a9eff;
      --green: #3a9a3a;
      --red: #9a3a3a;
      --text: #ffffff;
      --text-muted: #a0a0b0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }

    .reward-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, rgba(212, 160, 23, 0.15), transparent 60%);
    }
    
    .reward-card {
      background: var(--bg-gray);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(212, 160, 23, 0.3);
      position: relative;
      overflow: hidden;
    }

    .reward-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(245, 179, 1, 0.06), transparent 40%);
      animation: rotate 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .reward-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
      position: relative;
      z-index: 2;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    
    .reward-title {
      color: var(--gold-light);
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 0 0 30px rgba(245, 179, 1, 0.5);
      position: relative;
      z-index: 2;
    }
    
    .reward-subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 30px;
      line-height: 1.7;
      position: relative;
      z-index: 2;
    }
    
    .reward-code-box {
      background: var(--bg-dark);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }
    
    .reward-code-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .reward-code {
      color: var(--gold-light);
      font-family: monospace;
      font-size: 18px;
      font-weight: 900;
      direction: ltr;
      letter-spacing: 2px;
    }
    
    .progress-circle {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 30px;
      z-index: 2;
    }
    
    .progress-circle svg {
      transform: rotate(-90deg);
    }
    
    .progress-circle-bg {
      fill: none;
      stroke: var(--bg-light);
      stroke-width: 12;
    }
    
    .progress-circle-fill {
      fill: none;
      stroke: var(--gold);
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
      filter: drop-shadow(0 0 10px var(--gold));
    }
    
    .progress-circle-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    
    .progress-circle-number {
      color: var(--gold-light);
      font-size: 42px;
      font-weight: 900;
      display: block;
      direction: ltr;
    }
    
    .progress-circle-label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
    }
    
    .referral-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
      position: relative;
      z-index: 2;
    }
    
    .referral-stat {
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 12px;
      padding: 18px 8px;
      transition: 0.3s;
    }

    .referral-stat.approved { border-color: var(--green); }
    .referral-stat.pending { border-color: var(--gold); }
    .referral-stat.received { border-color: var(--gold-light); box-shadow: 0 0 15px rgba(245, 179, 1, 0.4); }
    
    .referral-stat-value {
      display: block;
      color: var(--gold-light);
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 5px;
      direction: ltr;
    }

    .referral-stat.approved .referral-stat-value { color: #4ade80; }
    .referral-stat.pending .referral-stat-value { color: var(--gold-light); }
    .referral-stat.received .referral-stat-value { color: var(--gold-light); }
    
    .referral-stat-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .reward-message {
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      z-index: 2;
      display: none;
    }

    .reward-message.success {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(74, 222, 128, 0.05));
      border: 2px solid #4ade80;
      color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
    }

    .reward-message.eligible {
      background: linear-gradient(135deg, rgba(245, 179, 1, 0.15), rgba(245, 179, 1, 0.05));
      border: 2px solid var(--gold-light);
      color: var(--gold-light);
      box-shadow: 0 0 20px rgba(245, 179, 1, 0.4);
      animation: glowPulse 2s infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 179, 1, 0.4); }
      50% { box-shadow: 0 0 40px rgba(245, 179, 1, 0.8); }
    }

    .reward-message.info {
      background: rgba(74, 158, 255, 0.1);
      border: 2px solid var(--blue);
      color: var(--blue);
    }
    
    .claim-reward-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--bg-dark);
      border: none;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 25px rgba(245, 179, 1, 0.5);
      animation: pulse 2s infinite;
      position: relative;
      z-index: 2;
    }
    
    .claim-reward-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(245, 179, 1, 0.8);
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .claim-reward-btn:disabled {
      background: var(--bg-light);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      animation: none;
    }
    
    .share-referral-btn {
      width: 100%;
      padding: 15px;
      background: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.3s;
      position: relative;
      z-index: 2;
    }
    
    .share-referral-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
    }
    
    .back-link {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-top: 20px;
      transition: 0.3s;
      position: relative;
      z-index: 2;
    }
    
    .back-link:hover {
      color: var(--gold-light);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-weight: 700;
      position: relative;
      z-index: 2;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--bg-light);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 500px) {
      .reward-card { padding: 30px 20px; }
      .reward-title { font-size: 24px; }
      .reward-code { font-size: 15px; }
      .progress-circle { width: 150px; height: 150px; }
      .progress-circle-number { font-size: 34px; }
      .referral-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="reward-page">
    <div class="reward-card">
      
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p>جاري تحميل بياناتك...</p>
      </div>

      <div id="contentState" style="display: none;">
        <div class="reward-icon">🎁</div>
        
        <h1 class="reward-title">مكافأتك</h1>
        <p class="reward-subtitle">ادعُ 10 من أصدقائك واحصل على مربع مجاني في الجدارية!</p>
        
        <div class="reward-code-box">
          <div class="reward-code-label">🔗 رمز الإحالة الخاص بك</div>
          <div class="reward-code" id="myReferralCode">---</div>
        </div>
        
        <div class="progress-circle">
          <svg width="180" height="180">
            <circle class="progress-circle-bg" cx="90" cy="90" r="78"></circle>
            <circle class="progress-circle-fill" id="progressCircleFill" cx="90" cy="90" r="78" 
                    stroke-dasharray="490" stroke-dashoffset="490"></circle>
          </svg>
          <div class="progress-circle-text">
            <span class="progress-circle-number" id="referralCount">0</span>
            <span class="progress-circle-label">من 10</span>
          </div>
        </div>
        
        <div class="referral-stats">
          <div class="referral-stat approved">
            <span class="referral-stat-value" id="approvedCount">0</span>
            <span class="referral-stat-label">✅ مقبولة</span>
          </div>
          <div class="referral-stat pending">
            <span class="referral-stat-value" id="pendingCount">0</span>
            <span class="referral-stat-label">⏳ معلقة</span>
          </div>
          <div class="referral-stat received" id="rewardStatusBox">
            <span class="referral-stat-value" id="rewardStatusValue">—</span>
            <span class="referral-stat-label">🎁 المكافأة</span>
          </div>
        </div>

        <div class="reward-message" id="rewardMessage"></div>
        
        <button class="claim-reward-btn" id="claimRewardBtn" disabled>
          🔒 استلم مكافأتك
        </button>
        
        <button class="share-referral-btn" id="shareReferralBtn">
          📋 نسخ رابط الإحالة
        </button>
        
        <a href="index.html" class="back-link">← العودة إلى الجدارية</a>
      </div>

    </div>
  </div>

  <script type="module" src="reward.js"></script>
</body>
</html>
